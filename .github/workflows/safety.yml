
name: Rust Reliability and Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Read-only permissions by default.
permissions:
  contents: read

concurrency:
  group: safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting, Lints and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Run documentation tests
        run: cargo test --doc

      - name: Build documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  dependency_audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check known dependency vulnerabilities
        run: cargo audit

  memory_safety:
    name: Miri Undefined Behavior Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust and Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Prepare Miri
        run: cargo miri setup

      - name: Run tests under Miri
        run: cargo miri test

  formal_verification:
    name: Kani Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Kani
        uses: model-checking/kani-github-action@v1
        with:
          args: --tests

  fuzz_testing:
    name: Continuous Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Initialize cargo-fuzz structures
        run: |
          if [ ! -f fuzz/Cargo.toml ]; then
            cargo fuzz init
            cargo fuzz add yangon_bytes
          fi

      - name: Run fuzz target
        run: cargo fuzz run yangon_bytes -- -max_total_time=60

